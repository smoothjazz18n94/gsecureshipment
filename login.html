<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | GlobalSecure Logistics</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="login-section">
    <div class="login-card">
      <div class="login-logo">
        <i class="fas fa-shield-alt"></i> GlobalSecure
      </div>
      <div class="login-sub">Secure admin access — authorized personnel only</div>
      <input type="text" id="username" placeholder="Username" autocomplete="username">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">
        <i class="fas fa-lock"></i> &nbsp;Sign In
      </button>
      <div id="loginResult"></div>
      <a href="index.html" style="display:inline-block;margin-top:20px;color:var(--text-muted);font-size:0.82rem;transition:color 0.2s" onmouseover="this.style.color='var(--forest)'" onmouseout="this.style.color='var(--text-muted)'">
        ← Return to Website
      </a>
    </div>
  </section>

  <script>
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const result = document.getElementById("loginResult");
      if (!username || !password) {
        result.textContent = "Please enter both username and password.";
        result.style.color = "var(--error)";
        return;
      }
      try {
        const res = await fetch("/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          result.style.color = "var(--forest-mid)";
          result.textContent = data.message;
          setTimeout(() => window.location.href = "/admin.html", 500);
        } else {
          result.style.color = "var(--error)";
          result.textContent = data.message;
        }
      } catch (err) {
        result.style.color = "var(--error)";
        result.textContent = "Server error. Please try again.";
        console.error(err);
      }
    });
    // Allow enter key
    document.getElementById("password").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });
  </script>
</body>
</html>
